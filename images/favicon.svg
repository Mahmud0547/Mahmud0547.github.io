<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background circle -->
  <rect width="32" height="32" rx="8" fill="#070711"/>
  <!-- Teal accent bracket left -->
  <text x="4" y="23" font-family="monospace" font-size="18" font-weight="700" fill="#00c896">&lt;</text>
  <!-- White "M" initial -->
  <text x="11" y="23" font-family="'Space Grotesk', monospace" font-size="15" font-weight="700" fill="#e2e8f0">M</text>
  <!-- Teal accent bracket right — slightly smaller -->
  <text x="23" y="23" font-family="monospace" font-size="18" font-weight="700" fill="#00c896">&gt;</text>
</svg>
