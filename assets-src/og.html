<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;700;800&display=block" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #172A66; color: #fff; font-family: Onest, sans-serif; padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; position: relative; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; }
  .brand img { width: 44px; height: 44px; }
  h1 { font-size: 76px; line-height: 1.02; letter-spacing: -0.03em; font-weight: 800; max-width: 900px; }
  .foot { display: flex; align-items: center; justify-content: space-between; font-size: 26px; color: #C9D2EE; font-weight: 500; }
  .chip { background: #E0A526; color: #151827; font-weight: 700; padding: 14px 26px; border-radius: 14px; }
  .glow { position: absolute; right: -140px; top: -140px; width: 520px; height: 520px; border-radius: 50%; background: #233C8C; z-index: -1; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="brand"><img src="../public/brand/mark.svg" alt="">SimorghDev</div>
  <h1>Telegram bots and AI automation that run 24/7</h1>
  <div class="foot"><span>Mahmud Faiezov · Dushanbe, UTC+5</span><span class="chip">Fixed price · Source code included</span></div>
</body>
</html>
